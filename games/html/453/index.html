<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0" />
  <title>DreamEscape</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: #060612;
      font-family: arial, sans-serif;
      color: #ffffff;
      overflow: hidden;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(56.63% 56.63% at 50% 43.37%, #1c1726 0%, #060612 100%);
    }
    canvas.emscripten {
      display: none;
    }
    .loading {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      pointer-events: none;
      gap: 16px;
    }
    .spinner {
      height: 30px;
      width: 30px;
      border: 5px solid #bdff00;
      border-top: 5px solid #719900;
      border-radius: 100%;
      animation: rotation 0.8s linear infinite;
    }
    @keyframes rotation {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
    #status {
      font-weight: bold;
      color: #ffffff;
      font-size: 14px;
      letter-spacing: 0.02em;
    }
    #progress {
      width: 240px;
      height: 10px;
      -webkit-appearance: none;
      appearance: none;
      background: transparent;
      border: none;
    }
    #progress::-webkit-progress-bar {
      background-color: #8492a6;
      height: 10px;
      border-radius: 15px;
    }
    #progress::-webkit-progress-value {
      background-image: -webkit-linear-gradient(left, #719900, #bdff00);
      height: 10px;
      border-radius: 15px;
    }
    #progress::-moz-progress-bar {
      background-image: linear-gradient(to right, #719900, #bdff00);
      height: 10px;
      border-radius: 15px;
    }
    #pauseMenuContainer,
    #output-container,
    #message-container {
      display: none;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>
  <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>

  <div id="pauseMenuContainer" hidden>
    <div id="pauseMenuBorder">
      <div id="pauseMenu">
        <button id="resumeButton" onclick="resume()">Resume</button>
        <button id="quitButton" onclick="quitIfSupported()">Quit</button>
      </div>
    </div>
  </div>

  <div class="loading">
    <div class="spinner" id="spinner"></div>
    <div class="emscripten" id="status">Downloading...</div>
    <progress value="0" max="100" id="progress" hidden="1"></progress>
  </div>

  <div class="output-container" id="output-container">
    <button class="output-button" id="stats-button" style="visibility: hidden" onclick="toggleElement('multiplayer-stats-container')">Toggle Stats</button>
    <button class="output-button" id="share-button" style="visibility: hidden" onclick="navigator.clipboard.writeText(window.shareUrl)">Copy Share Url</button>
    <button class="output-button" id="log-state-button" onclick="log_next_game_state()" style="visibility: hidden">Log State</button>
    <textarea id="output" rows="8"></textarea>
  </div>

  <div id="message-container">
    <div id="messages"></div>
  </div>

  <script id="tick-worker" type="javascript/worker">
    let running = false;
    let stop_called = false;
    let intervalMs = 16;

    onmessage = (e) => {
      if (e.data.run) {
        intervalMs = Math.floor(1000 / e.data.fps);
        if (!running) {
          running = true;
          setTimeout(tick, intervalMs);
        }
      } else {
        stop_called = true;
      }
    }

    const tick = () => {
      if (stop_called) {
        stop_called = false;
        running = false;
        return;
      }
      const start = new Date().getTime();
      postMessage('');
      const end = new Date().getTime();
      let next_update = start + intervalMs - end;
      next_update = Math.max(next_update, 0);
      setTimeout(tick, next_update);
    }
  </script>

  <script type="text/javascript">
    const worker = new Worker(window.URL.createObjectURL(new Blob([document.querySelector('#tick-worker').textContent])));

    worker.onmessage = function () {
      GM_tick(performance.now());
    }

    const isMultiplayer = function () {
      if (typeof GM_is_multiplayer !== 'function') return false;
      return GM_is_multiplayer() !== 0;
    }

    document.addEventListener('visibilitychange', function () {
      if (!isMultiplayer()) return;
      if (document.visibilityState === 'hidden') {
        worker.postMessage({run: true, fps: 60});
      } else {
        worker.postMessage({run: false});
      }
    });
  </script>

  <script>
  (async function() {
    const ZIP_URL = 'https://quizizz.com/_media/uploadedFiles/2829cce2-324f-4d66-b161-b6eccfcefba5-v2';

    const statusElement = document.getElementById('status');
    const spinnerElement = document.getElementById('spinner');
    const progressElement = document.getElementById('progress');

    const fileMap = new Map();
    const blobUrlMap = new Map();

    function cleanPath(url) {
      let s = String(url);
      if (s.startsWith('blob:')) return null;
      s = s.replace(window.location.origin, '');
      s = s.replace(/^https?:\/\/[^\/]+/, '');
      s = s.split('?')[0].split('#')[0];
      s = s.replace(/^\.\//, '').replace(/^\//, '');
      return s.toLowerCase();
    }

    function getBlob(path) {
      if (!path) return null;
      const clean = cleanPath(path);
      if (!clean) return null;
      if (fileMap.has(clean)) return fileMap.get(clean);
      const filename = clean.split('/').pop();
      for (const [key, blob] of fileMap.entries()) {
        if (key === filename || key.endsWith('/' + filename)) return blob;
      }
      return null;
    }

    function getBlobUrl(path) {
      const clean = cleanPath(path);
      if (!clean) return null;
      if (blobUrlMap.has(clean)) return blobUrlMap.get(clean);
      const blob = getBlob(path);
      if (!blob) return null;
      const url = URL.createObjectURL(blob);
      blobUrlMap.set(clean, url);
      return url;
    }

    function fmtMB(bytes) {
      return (bytes / (1024 * 1024)).toFixed(1);
    }

    window.getBlob = getBlob;

    try {
      statusElement.innerText = 'Downloading game package...';
      progressElement.hidden = false;
      progressElement.value = 0;

      const zipRes = await fetch(ZIP_URL);
      if (!zipRes.ok) throw new Error(`HTTP error! status: ${zipRes.status}`);

      const totalBytes = parseInt(zipRes.headers.get('Content-Length') || '0', 10);
      const reader = zipRes.body.getReader();
      const chunks = [];
      let received = 0;

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        chunks.push(value);
        received += value.length;

        if (totalBytes > 0) {
          const pct = Math.round((received / totalBytes) * 50);
          progressElement.value = pct;
          statusElement.innerText = `Downloading... ${fmtMB(received)} / ${fmtMB(totalBytes)} MB`;
        } else {
          statusElement.innerText = `Downloading... ${fmtMB(received)} MB`;
        }
      }

      const arrayBuffer = new Uint8Array(received);
      let offset = 0;
      for (const c of chunks) {
        arrayBuffer.set(c, offset);
        offset += c.length;
      }

      statusElement.innerText = 'Extracting package...';
      progressElement.value = 50;

      const zip = await JSZip.loadAsync(arrayBuffer.buffer);

      let rootPrefix = '';
      const zipKeys = Object.keys(zip.files);
      const runnerJsKey = zipKeys.find(k => k.endsWith('runner.js'));
      if (runnerJsKey) {
        rootPrefix = runnerJsKey.substring(0, runnerJsKey.indexOf('runner.js'));
      }

      const allEntries = Object.entries(zip.files).filter(([, f]) => !f.dir);
      const totalEntries = allEntries.length;
      let processed = 0;

      for (const [relativePath, file] of allEntries) {
        let clean = relativePath;
        if (rootPrefix && clean.startsWith(rootPrefix)) {
          clean = clean.substring(rootPrefix.length);
        }
        clean = clean.replace(/^\//, '').toLowerCase();

        let mimeType = 'application/octet-stream';
        if (clean.endsWith('.js')) mimeType = 'application/javascript';
        else if (clean.endsWith('.wasm')) mimeType = 'application/wasm';
        else if (clean.endsWith('.json')) mimeType = 'application/json';
        else if (clean.endsWith('.css')) mimeType = 'text/css';
        else if (clean.endsWith('.html')) mimeType = 'text/html';
        else if (clean.endsWith('.svg')) mimeType = 'image/svg+xml';
        else if (clean.endsWith('.png')) mimeType = 'image/png';
        else if (clean.endsWith('.ogg')) mimeType = 'audio/ogg';
        else if (clean.endsWith('.mp3')) mimeType = 'audio/mpeg';
        else if (clean.endsWith('.wav')) mimeType = 'audio/wav';

        const blob = await file.async('blob');
        fileMap.set(clean, new Blob([blob], { type: mimeType }));

        processed++;
        progressElement.value = 50 + Math.round((processed / totalEntries) * 50);
      }

      const originalFetch = window.fetch;
      window.fetch = async function(input, init) {
        const urlStr = typeof input === 'string' ? input : (input && input.url ? input.url : '');
        const blob = getBlob(urlStr);
        if (blob) {
          return new Response(blob, {
            status: 200, statusText: 'OK',
            headers: {
              'Content-Type': blob.type || 'application/octet-stream',
              'Content-Length': blob.size.toString()
            }
          });
        }
        return originalFetch(input, init);
      };

      const OriginalXHR = window.XMLHttpRequest;
      window.XMLHttpRequest = function() {
        const xhr = new OriginalXHR();
        const originalOpen = xhr.open;
        const originalSend = xhr.send;
        let savedUrl = null;

        xhr.open = function(method, url, ...args) {
          savedUrl = url;
          return originalOpen.call(this, method, url, ...args);
        };

        xhr.send = function(...args) {
          if (typeof savedUrl === 'string') {
            const blobUrl = getBlobUrl(savedUrl);
            if (blobUrl) originalOpen.call(this, 'GET', blobUrl, true);
          }
          return originalSend.apply(this, args);
        };

        return xhr;
      };
      window.XMLHttpRequest.prototype = OriginalXHR.prototype;

      const cssBlob = getBlob('style.css');
      if (cssBlob) {
        const styleEl = document.createElement('style');
        styleEl.textContent = await cssBlob.text();
        document.head.appendChild(styleEl);
      }

      statusElement.innerText = 'Loading game...';
      progressElement.value = 100;

      const gameGlueBlob = getBlob('script.js');
      if (!gameGlueBlob) throw new Error('script.js not found in ZIP');

      const gameGlueScript = document.createElement('script');
      gameGlueScript.type = 'text/javascript';
      gameGlueScript.text = await gameGlueBlob.text();
      document.body.appendChild(gameGlueScript);

      statusElement.innerText = 'Loading runtime...';

      const runnerBlob = getBlob('runner.js');
      if (!runnerBlob) throw new Error('runner.js not found in ZIP');

      const runnerScript = document.createElement('script');
      runnerScript.async = true;
      runnerScript.type = 'text/javascript';
      runnerScript.src = URL.createObjectURL(runnerBlob);
      document.body.appendChild(runnerScript);
    } catch (err) {
      console.error(err);
      statusElement.innerText = 'Execution failed: ' + err.message;
      spinnerElement.style.display = 'none';
      progressElement.hidden = true;
    }
  })();
  </script>
</body>
</html>
