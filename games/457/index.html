<!DOCTYPE html>
<html lang="en-us">
<head>
  <base href="https://cdn.jsdelivr.net/gh/web-ports/gorilla-tag@latest/">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Unity WebGL Player | Gorilla Tag Web</title>

  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <link rel="stylesheet" href="TemplateData/style.css">

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #231f20;
    }

    #unity-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    #unity-canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #loading-text {
      color: white;
      font-size: 48px;
      font-family: cursive;
      text-align: center;
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <div id="loading-text">LOADING...</div>

  <div id="unity-container" class="unity-desktop" hidden>
    <canvas id="unity-canvas" tabindex="-1"></canvas>

    <div id="unity-loading-bar">
      <div id="unity-logo"></div>

      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
    </div>
  </div>

  <script>
    const loadingText = document.getElementById("loading-text");
    const unityContainer = document.getElementById("unity-container");
    const canvas = document.getElementById("unity-canvas");
    const loadingBar = document.getElementById("unity-loading-bar");
    const progressBar = document.getElementById("unity-progress-bar-full");

    let loadedBytes = 0;

    async function fetchWithProgress(url) {
      const response = await fetch(url);

      if (!response.ok) {
        throw new Error(`Failed to load ${url}: ${response.status}`);
      }

      if (!response.body) {
        throw new Error(`Streaming is not supported for ${url}`);
      }

      const reader = response.body.getReader();
      const chunks = [];
      let received = 0;

      while (true) {
        const { done, value } = await reader.read();

        if (done) break;

        received += value.length;
        loadedBytes += value.length;
        chunks.push(value);

        const mbLoaded = (loadedBytes / (1024 * 1024)).toFixed(2);

        loadingText.textContent =
          `LOADING... ${mbLoaded} MB / 150.89 MB`;
      }

      const buffer = new Uint8Array(received);
      let offset = 0;

      for (const chunk of chunks) {
        buffer.set(chunk, offset);
        offset += chunk.length;
      }

      return buffer.buffer;
    }

    function getParts(file, start, end) {
      return Array.from(
        { length: end - start + 1 },
        (_, index) => `${file}.part${start + index}`
      );
    }

    async function mergeFiles(fileParts) {
      const buffers = await Promise.all(
        fileParts.map(fetchWithProgress)
      );

      return URL.createObjectURL(new Blob(buffers));
    }

    async function startUnity() {
      try {
        const dataUrl = await mergeFiles(
          getParts("Build/gtagwebR2.data.unityweb", 1, 8)
        );

        const buildUrl = "Build";

        const config = {
          dataUrl: dataUrl,
          frameworkUrl: `${buildUrl}/gtagwebR2.framework.js.unityweb`,
          codeUrl: `${buildUrl}/gtagwebR2.wasm.unityweb`,
          streamingAssetsUrl: "StreamingAssets",
          companyName: "boolonx",
          productName: "gorilla tag web",
          productVersion: "1.0"
        };

        unityContainer.hidden = false;

        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
          unityContainer.className = "unity-mobile";
          config.devicePixelRatio = 1;
        }

        function resizeCanvas() {
          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight;
          canvas.style.width = `${window.innerWidth}px`;
          canvas.style.height = `${window.innerHeight}px`;
        }

        resizeCanvas();
        window.addEventListener("resize", resizeCanvas);

        loadingBar.style.display = "block";

        const script = document.createElement("script");
        script.src = `${buildUrl}/gtagwebR2.loader.js`;

        script.onload = () => {
          createUnityInstance(
            canvas,
            config,
            progress => {
              progressBar.style.width = `${progress * 100}%`;
            }
          )
            .then(() => {
              loadingText.remove();
              loadingBar.style.display = "none";
              canvas.style.display = "block";
            })
            .catch(error => {
              console.error("Unity failed to start:", error);
              loadingText.textContent = "FAILED TO LOAD";
            });
        };

        script.onerror = () => {
          loadingText.textContent = "FAILED TO LOAD";
          console.error("Failed to load Unity loader.");
        };

        document.body.appendChild(script);

      } catch (error) {
        console.error("Failed to initialize Unity:", error);
        loadingText.textContent = "FAILED TO LOAD";
      }
    }

    startUnity();
  </script>

</body>
</html>
