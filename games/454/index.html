<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>Baldi's Basics Classic</title>

  <style>
    body { padding: 0; margin: 0 }
    #unity-container { position: fixed; width: 100%; height: 100%; }
    #unity-canvas { width: 100%; height: 100%; background: #1F1F20 }
    #unity-loading-bar { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: none }
    #unity-logo { width: 154px; height: 130px; background: url('https://quizizz.com/_media/uploads/6502a5d2-9f45-4262-9b58-dcf797b02a7e-v2') no-repeat center }
    #unity-progress-bar-empty { margin-left: auto; margin-right: auto; width: 141px; height: 18px; margin-top: 10px; background: url('https://quizizz.com/_media/uploads/04cee122-6d01-4b29-ba51-78ff82a6fd0d-v2') no-repeat center }
    #unity-progress-bar-full { width: 0%; height: 18px; margin-top: 10px; background: url('https://quizizz.com/_media/uploads/8cb62459-520c-4d72-8372-48997b65b66f-v2') no-repeat center }
    #unity-warning { position: absolute; left: 50%; top: 5%; transform: translate(-50%); background: white; padding: 10px; display: none }
  </style>
</head>

<body>
  <div id="unity-container">
    <canvas id="unity-canvas" width="960" height="600" tabindex="-1"></canvas>

    <div id="unity-loading-bar">
      <div id="unity-logo"></div>
      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
    </div>

    <div id="unity-warning"></div>
  </div>

  <script>
    var container = document.querySelector("#unity-container");
    var canvas = document.querySelector("#unity-canvas");
    var loadingBar = document.querySelector("#unity-loading-bar");
    var progressBarFull = document.querySelector("#unity-progress-bar-full");
    var warningBanner = document.querySelector("#unity-warning");

    function unityShowBanner(msg, type) {
      function updateBannerVisibility() {
        warningBanner.style.display = warningBanner.children.length ? "block" : "none";
      }

      var div = document.createElement("div");
      div.innerHTML = msg;
      warningBanner.appendChild(div);

      if (type == "error") {
        div.style = "background: red; padding: 10px;";
      } else {
        if (type == "warning") {
          div.style = "background: yellow; padding: 10px;";
        }

        setTimeout(function() {
          warningBanner.removeChild(div);
          updateBannerVisibility();
        }, 5000);
      }

      updateBannerVisibility();
    }

    var loaderUrl = "https://quizizz.com/_media/uploads/cdeb78a3-a8da-4d59-8bb8-8666b195966d-v2";

    var config = {
      dataUrl: "https://quizizz.com/_media/uploads/5bb9aded-3345-4d7d-8972-21f52307b12d-v2",
      frameworkUrl: "https://quizizz.com/_media/uploads/4ef6f352-5eec-45f9-a3fa-29b2eccfe99e-v2",
      codeUrl: "https://quizizz.com/_media/uploads/58725b94-2dae-426d-bbcd-cef3ac10eeef-v2",
      companyName: "Basically Games",
      productName: "Baldi's Basics Classic",
      productVersion: "1.4.2",
      showBanner: unityShowBanner
    };

    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      var meta = document.createElement("meta");
      meta.name = "viewport";
      meta.content = "width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes";
      document.getElementsByTagName("head")[0].appendChild(meta);
    }

    loadingBar.style.display = "block";

    var script = document.createElement("script");
    script.src = loaderUrl;

    script.onload = () => {
      createUnityInstance(canvas, config, (progress) => {
        progressBarFull.style.width = 100 * progress + "%";
      }).then((unityInstance) => {
        loadingBar.style.display = "none";
      }).catch((message) => {
        alert(message);
      });
    };

    document.body.appendChild(script);
  </script>
</body>
</html>
