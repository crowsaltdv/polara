            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #000;
            z-index: 9999;
        }
        .spinner {
            border: 4px solid rgba(255,255,255,0.1);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border-left-color: #09f;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0%   { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        #progress-wrap {
            margin-top: 20px;
            width: 260px;
            height: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
            overflow: hidden;
            display: none;

            opacity: 0.85;

        #sub-text {
            margin-top: 6px;
            font-size: 12px;

            const NativeURL = window.URL;

                if (base && typeof base === 'string' && base.startsWith('blob:')) {

                }
                return new NativeURL(url, base);
            };
            Object.assign(window.URL, NativeURL);

            statusText.innerText = "Downloading game assets...";
            showProgress(true);
            setProgress(0);

            const zipRes = await fetch(ZIP_URL);
            if (!zipRes.ok) throw new Error(`HTTP error! status: ${zipRes.status}`);

            const totalBytes = parseInt(zipRes.headers.get('Content-Length') || '0', 10);
            const reader = zipRes.body.getReader();
            const chunks = [];
            let received = 0;

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                chunks.push(value);
                received += value.length;

                if (totalBytes > 0) {
                    setProgress(received / totalBytes);
                    subText.innerText = `${fmtMB(received)} MB / ${fmtMB(totalBytes)} MB`;
                } else {
                    subText.innerText = `${fmtMB(received)} MB`;
                }
            }

            const arrayBuffer = new Uint8Array(received);
            let offset = 0;
            for (const c of chunks) {
                arrayBuffer.set(c, offset);
                offset += c.length;
            }

            statusText.innerText = "Extracting package...";
            setProgress(0);
            subText.innerText = '';

            const zip = await JSZip.loadAsync(arrayBuffer.buffer);

            let rootPrefix = '';
            const zipFileKeys = Object.keys(zip.files);
            const dataJsKey = zipFileKeys.find(key => key.endsWith('data.js'));
            if (dataJsKey) {
                rootPrefix = dataJsKey.substring(0, dataJsKey.indexOf('data.js'));
            }

            const fileMap = new Map();
            const textContentMap = new Map();
            let joltBlobUrl = null;

            const allEntries = Object.entries(zip.files).filter(([, f]) => !f.dir);
            const totalEntries = allEntries.length;
            let processed = 0;

            for (const [relativePath, file] of allEntries) {
                let cleanPath = relativePath;
                if (rootPrefix && cleanPath.startsWith(rootPrefix)) {
                    cleanPath = cleanPath.substring(rootPrefix.length);
                }
                cleanPath = cleanPath.replace(/^\//, '');

                let mimeType = 'application/octet-stream';
                if (cleanPath.endsWith('.mp4')) mimeType = 'video/mp4';
                else if (cleanPath.endsWith('.webm')) mimeType = 'video/webm';
                else if (cleanPath.endsWith('.ogv')) mimeType = 'video/ogg';
                else if (cleanPath.endsWith('.png')) mimeType = 'image/png';
                else if (cleanPath.endsWith('.jpg') || cleanPath.endsWith('.jpeg')) mimeType = 'image/jpeg';
                else if (cleanPath.endsWith('.js')) mimeType = 'application/javascript';
                else if (cleanPath.endsWith('.json')) mimeType = 'application/json';
                else if (cleanPath.endsWith('.wasm')) mimeType = 'application/wasm';

                const blob = await file.async('blob');
                const typedBlob = new Blob([blob], { type: mimeType });
                fileMap.set(cleanPath.toLowerCase(), typedBlob);

                if (cleanPath.endsWith('.js') || cleanPath.endsWith('.json')) {
                    const txt = await file.async('text');
                    textContentMap.set(cleanPath, txt);
                }

                if (/jolt.*\.js$/i.test(cleanPath)) {
                    joltBlobUrl = URL.createObjectURL(typedBlob);
                }

                processed++;
                setProgress(processed / totalEntries);
                subText.innerText = `${processed} / ${totalEntries} files`;
            }

            if (joltBlobUrl) {
                const importMap = {
                    imports: {
                        "./jolt-physics.wasm.js": joltBlobUrl,
                        "jolt-physics": joltBlobUrl
                    }
                };
                const imScript = document.createElement('script');
                imScript.type = 'importmap';
                imScript.textContent = JSON.stringify(importMap);
                document.head.appendChild(imScript);

                const joltModule = document.createElement('script');
                joltModule.type = 'module';
                joltModule.text = `import ${JSON.stringify(joltBlobUrl)};`;
                document.head.appendChild(joltModule);

                await new Promise(r => setTimeout(r, 0));
            }

            function findFileBlob(target) {
                if (!target || typeof target !== 'string') return null;

                let clean = target.replace(/^blob:/, '')
                                  .replace(window.location.origin, '')
                                  .replace(/^https?:\/\/[^\/]+/, '')
                                  .split('?')[0]
                                  .replace(/^\.\//, '')
                                  .replace(/^\//, '')
                                  .toLowerCase();

                if (fileMap.has(clean)) return fileMap.get(clean);

                const filename = clean.split('/').pop();
                for (const [key, blob] of fileMap.entries()) {
                    if (key === filename || key.endsWith('/' + filename)) {
                        return blob;
                    }
                }
                return null;
            }

            const originalFetch = window.fetch;
            window.fetch = async function(input, init) {
                let urlStr = typeof input === 'string' ? input : (input && input.url ? input.url : '');

                if (urlStr.includes('api.gdevelop-app.com/analytics')) {
                    return new Response(JSON.stringify({ status: "blocked" }), {
                        status: 200,
                        statusText: 'OK',
                        headers: { 'Content-Type': 'application/json' }
                    });
                }

                const blob = findFileBlob(urlStr);
                if (blob) {
                    return new Response(blob, {
                        status: 200,
                        statusText: 'OK',
                        headers: {
                            'Content-Type': blob.type || 'application/octet-stream',
                            'Content-Length': blob.size.toString()
                        }
                    });
                }
                return originalFetch(input, init);
            };

            const originalXHR = window.XMLHttpRequest.prototype.open;
            window.XMLHttpRequest.prototype.open = function(method, url, ...args) {
                if (typeof url === 'string') {
                    if (url.includes('api.gdevelop-app.com/analytics')) {
                        url = 'data:application/json,{}';
                    } else {
                        const blob = findFileBlob(url);
                        if (blob) {
                            url = URL.createObjectURL(blob);
                        }
                    }
                }
                return originalXHR.call(this, method, url, ...args);
            };

            const patchSrc = (proto) => {
                const descriptor = Object.getOwnPropertyDescriptor(proto, 'src');
                if (!descriptor) return;

                Object.defineProperty(proto, 'src', {
                    get: function() {
                        return descriptor.get.call(this);
                    },
                    set: function(val) {
                        if (typeof val === 'string' && !val.startsWith('blob:')) {
                            const blob = findFileBlob(val);
                            if (blob) {
                                val = URL.createObjectURL(blob);
                            }
                        }
                        descriptor.set.call(this, val);
                    }
                });
            };

            patchSrc(HTMLMediaElement.prototype);
            patchSrc(HTMLSourceElement.prototype);
            patchSrc(HTMLImageElement.prototype);

            const originalSetAttribute = Element.prototype.setAttribute;
            Element.prototype.setAttribute = function(name, value) {
                if (name.toLowerCase() === 'src' && typeof value === 'string' && !value.startsWith('blob:')) {
                    const blob = findFileBlob(value);
                    if (blob) {
                        value = URL.createObjectURL(blob);
                    }
                }
                return originalSetAttribute.call(this, name, value);
            };

            statusText.innerText = "Executing game runtime...";
            setProgress(1);
            subText.innerText = '';

            for (const scriptPath of scriptOrder) {
                if (textContentMap.has(scriptPath)) {
                    const scriptEl = document.createElement('script');
                    scriptEl.text = textContentMap.get(scriptPath);
                    document.head.appendChild(scriptEl);
                }
            }

            document.getElementById('loading-screen').style.display = 'none';

            if (typeof gdjs !== 'undefined' && gdjs.projectData) {
                const game = new gdjs.RuntimeGame(gdjs.projectData, {});
                game.getRenderer().createStandardCanvas(document.body);
                game.getRenderer().bindStandardEvents(game.getInputManager(), window, document);
                game.loadAllAssets(function() {
                    game.startGameLoop();
                });
            } else {
                throw new Error("GDevelop engine missing or projectData invalid.");
            }

        } catch (err) {
            console.error("Game execution failed:", err);
            statusText.innerText = "Execution failed: " + err.message;
            showProgress(false);
            subText.innerText = '';
        }
    })();

(function () {
    const M = 4.5;
    const p = MouseEvent.prototype;
    if (p.__spMouse)
        return;
    const x = Object.getOwnPropertyDescriptor(p, 'movementX');
    const y = Object.getOwnPropertyDescriptor(p, 'movementY');
    if (x && x.get)
        Object.defineProperty(p, 'movementX', {
            configurable: true,
            get() {
                return x.get.call(this) * M
            }
        });
    if (y && y.get)
        Object.defineProperty(p, 'movementY', {
            configurable: true,
            get() {
                return y.get.call(this) * M
            }
        });
    p.__spMouse = true;
})();
    </script>
